map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name 103.56.84.85;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/103.56.84.85/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.56.84.85/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    # Resolve the backend again after Compose recreates its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
